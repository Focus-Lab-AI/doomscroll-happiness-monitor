<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Doomscroll Happiness Monitor · camera</title>
  <style>
    body { margin: 12px; font: 13px/1.4 system-ui, sans-serif; color: #444; }
    video { width: 160px; border-radius: 4px; background: #000; }
    canvas { display: none; }
    #status { font-weight: 600; color: #222; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <!-- In Chrome this is an invisible offscreen document. Firefox has no offscreen API, so it opens
       as a small window that minimizes itself once the camera is running. -->
  <video id="video" autoplay playsinline muted></video>
  <p id="status"></p>
  <p>Doomscroll Happiness Monitor is reading your mood locally. This window closes when you leave social media.</p>
  <canvas id="frame"></canvas>
  <canvas id="thumb"></canvas>
  <script src="../shared/compat.js"></script>
  <script src="../../lib/face-api.js"></script>
  <script type="module" src="offscreen.js"></script>
</body>
</html>
